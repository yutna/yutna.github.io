<div class="deck" data-deck role="group" aria-labelledby="coming-title">
  <h2 class="visually-hidden" id="coming-title">What's coming</h2>
  <div class="deck__stage" data-deck-stage>
    {%- for layer in site.data.layers %}
    <button
      class="layer layer--{{ layer.tone }}{% if forloop.first %} is-active{% endif %}"
      type="button"
      data-layer="{{ forloop.index0 }}"
      aria-pressed="{{ forloop.first }}"
      style="--i: {{ forloop.index0 }}; --d: {{ forloop.index0 | minus: 1.5 | abs }}"
    >
      <span class="layer__shell" aria-hidden="true">
        <span class="layer__ghost">{{ layer.index }}</span>
      </span>
      <span class="layer__card">
        <span class="layer__top">
          <span class="layer__index">{{ layer.index }}</span>
          <span class="layer__dot" aria-hidden="true"></span>
        </span>
        <span class="layer__name">{{ layer.name }}</span>
        <span class="layer__note">{{ layer.note }}</span>
        <span class="layer__foot">
          <span class="layer__status">{{ layer.status }}</span>
        </span>
      </span>
    </button>
    {%- endfor %}
  </div>
  <p class="visually-hidden" aria-live="polite" data-deck-status></p>
</div>
