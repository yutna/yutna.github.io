version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    labels: [dependencies]
    assignees: [yutna]
    commit-message:
      prefix: chore
      include: scope # -> "chore(deps): bump ...", which passes the PR title check
  # stack ecosystems are appended here (npm, maven, bundler, swift, pip, gomod, mix, ...)
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    groups:
      bundler:
        update-types: [minor, patch]
    labels: [dependencies]
    assignees: [yutna]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # The types track the Node runtime pinned in .mise.toml. A major bump
      # would describe APIs this site cannot run.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels: [dependencies]
    assignees: [yutna]
    commit-message:
      prefix: chore
      include: scope
